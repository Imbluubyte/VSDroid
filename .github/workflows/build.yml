name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK; just accept licences and make sure the needed parts exist.
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Rebuilds the fixed signing key from a repository secret. Forks and fork pull requests have no
      # secrets, so they skip this and the build falls back to the debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VSDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vsdroid-release.jks"
            echo "VSDROID_KEYSTORE_FILE=$RUNNER_TEMP/vsdroid-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the VSDroid key."
          else
            echo "No signing key available: signing with the debug key (updates won't install over other builds)."
          fi

      - name: Build debug APK
        env:
          VSDROID_KEYSTORE_PASSWORD: ${{ secrets.VSDROID_KEYSTORE_PASSWORD }}
          VSDROID_KEY_ALIAS: ${{ secrets.VSDROID_KEY_ALIAS }}
          VSDROID_KEY_PASSWORD: ${{ secrets.VSDROID_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      # Same fingerprint on every build = APKs can be installed over each other.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: VSDroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
